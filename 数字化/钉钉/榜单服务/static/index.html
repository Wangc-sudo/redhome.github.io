<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>杭州销售完成率榜单</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#1f2329;padding:16px;max-width:1080px;margin:0 auto}
h1{font-size:20px;margin-bottom:4px}
.sub{color:#8a919f;font-size:13px;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card .k{font-size:12px;color:#8a919f;margin-bottom:4px}
.card .v{font-size:20px;font-weight:700}
.card .s{font-size:11px;color:#8a919f;margin-top:2px}
.g{color:#0ab561}.r{color:#e54545}.y{color:#e8830c}.gray{color:#8a919f}
.panel{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px}
.panel h2{font-size:15px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:#8a919f;font-weight:500;padding:6px 8px;border-bottom:1px solid #eef0f3;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid #f3f4f6;white-space:nowrap}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.strong{font-weight:600}
tr.top td{background:#f0fbf5}tr.bottom td{background:#fdf2f2}
.rank{color:#8a919f;text-align:center;width:34px}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px}
.badge.green{background:#e8f8f0;color:#0ab561}.badge.red{background:#fdeeee;color:#e54545}
.badge.amber{background:#fdf3e6;color:#e8830c}.badge.gray{background:#f0f1f3;color:#8a919f}
.bar{position:relative;background:#eef0f3;border-radius:4px;height:18px;min-width:110px}
.fill{height:100%;border-radius:4px;position:absolute;top:0;left:0}
.fill.g{background:linear-gradient(90deg,#12b76a,#0ab561)}
.fill.y{background:linear-gradient(90deg,#f79009,#e8830c)}
.fill.r{background:linear-gradient(90deg,#f04438,#e54545)}
.marker{position:absolute;top:-2px;bottom:-2px;width:2px;background:#1f2329;opacity:.45}
.barlabel{position:absolute;right:6px;top:0;line-height:18px;font-size:11px;color:#1f2329}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{padding:6px 16px;border-radius:8px;background:#eef0f3;cursor:pointer;font-size:13px}
.tab.on{background:#1f2329;color:#fff}
.dept-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.dept-card{border:1px solid #eef0f3;border-radius:10px;padding:14px}
.dept-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.dept-name{font-weight:700;font-size:15px;margin-right:8px}
.dept-rate{font-weight:700;font-size:16px}
.dept-rate .badge{margin-left:6px}
.dept-sub{font-size:12px;color:#8a919f;margin-bottom:8px}
table.mini td,table.mini th{padding:4px 6px}
.warn{color:#e54545;font-weight:600}.ok{color:#0ab561}
.muted{color:#8a919f}.small{font-size:12px}
.note{font-size:12px;color:#8a919f;line-height:1.8}
.note b{color:#4e5761}
.trend{width:100%;height:44px;margin-top:6px}
.state{padding:40px 0;text-align:center;color:#8a919f;font-size:14px}
.refresh-tip{font-size:12px;color:#8a919f;margin-top:4px}
</style></head><body>
<h1>杭州销售日报 · 完成率榜单</h1>
<div class="sub" id="subtitle">加载中 …</div>
<div id="content"><div class="state">正在获取最新榜单数据 …</div></div>
<div class="refresh-tip" id="refreshTip"></div>

<script>
let DATA=null, HIST=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtWan(v){v=parseFloat(v);if(!isFinite(v))return'—';
  if(v>=1e8)return(v/1e8).toFixed(2)+'亿';
  if(v>=1e4)return(v/1e4).toFixed(1)+'万';
  return Math.round(v).toLocaleString()}
function fmtPct(v,d=1){return v==null?'—':(v*100).toFixed(d)+'%'}

function barHtml(rate,progress){
  if(rate==null)return'<span class="muted">—</span>';
  const w=Math.min(rate*100,100), mk=Math.min(progress*100,100);
  const cls=rate>=progress?'g':(rate>=progress*0.8?'y':'r');
  return `<div class="bar"><div class="fill ${cls}" style="width:${w.toFixed(1)}%"></div>`+
         `<div class="marker" style="left:${mk.toFixed(1)}%"></div>`+
         `<span class="barlabel">${fmtPct(rate)}</span></div>`}

function badgeHtml(rate,progress){
  if(rate==null)return'<span class="badge gray">无目标</span>';
  const d=rate-progress;
  if(d>=0)return`<span class="badge green">领先 ${fmtPct(d)}</span>`;
  if(d>=-0.05)return`<span class="badge amber">落后 ${fmtPct(-d)}</span>`;
  return`<span class="badge red">落后 ${fmtPct(-d)}</span>`}

function render(){
  const p=DATA, pr=p.progress, ov=p.overall, prog=pr.pct;
  $('subtitle').textContent=`${p.year}年${p.month}月 · 数据截至 ${p.stat_through} · 更新于 ${p.generated_at}`;

  const trendSvg=buildTrend();
  $('content').innerHTML=`
  <div class="cards">
    <div class="card"><div class="k">时间进度</div><div class="v">${fmtPct(prog)}</div><div class="s">${pr.elapsed} / ${pr.total} 个工作日</div></div>
    <div class="card"><div class="k">杭州整体完成率</div><div class="v ${ov.rate>=prog?'g':'r'}">${fmtPct(ov.rate)}</div><div class="s">${fmtWan(ov.completed)} / ${fmtWan(ov.target)}</div></div>
    <div class="card"><div class="k">整体进度差</div><div class="v ${ov.rate>=prog?'g':'r'}">${fmtPct(ov.rate-prog)}</div><div class="s">相对时间进度</div></div>
    <div class="card"><div class="k">参与人数</div><div class="v">${p.people.length}</div><div class="s">未填 0 天：${p.people.filter(x=>x.unfilled==0).length} 人</div></div>
  </div>

  ${(HIST&&HIST.series.length>1)?`<div class="panel"><h2>📈 整体完成率走势</h2>${trendSvg}
    <div class="small muted" style="margin-top:4px">绿线=整体完成率 · 灰线=时间进度基准（当月每日快照）</div></div>`:''}

  <div class="panel">
    <h2>📣 每日播报（部门维度）</h2>
    <table><thead><tr><th>排名</th><th>部门</th><th>人数</th><th>完成金额</th><th>目标</th><th>完成率</th><th>进度差</th><th>日均完成</th><th>预计月末</th><th>未填</th></tr></thead>
    <tbody>${deptBcRows()}</tbody></table>
    <div class="small muted" style="margin-top:8px">排名按完成率；完整个人明细见下方</div>
  </div>

  <div class="panel">
    <div class="tabs">
      <div class="tab on" data-tab="person" onclick="sw(this)">个人总榜</div>
      <div class="tab" data-tab="dept" onclick="sw(this)">部门维度</div>
    </div>
    <div id="tab-person">
    <table><thead><tr><th>排名</th><th>姓名</th><th>部门</th><th>完成金额</th><th>目标</th><th>完成率</th><th>进度差</th><th>日均完成</th><th>预计月末</th><th>未填</th></tr></thead>
    <tbody>${personRows()}</tbody></table>
    </div>
    <div id="tab-dept" style="display:none"><div class="dept-grid">${deptCards()}</div></div>
  </div>

  <div class="panel note">
    <b>口径说明</b><br>
    · 完成率 = 累计完成金额 ÷ ${p.month}月销量目标；统计范围为已过工作日内的日列<br>
    · 时间进度 = 已过工作日 ${pr.elapsed} ÷ 全月工作日 ${pr.total} = ${fmtPct(prog)}（黑竖线为达标基准）<br>
    · 进度差 = 完成率 − 时间进度；预计月末 = 完成率 ÷ 时间进度（线性外推，仅供参考）<br>
    · 未填 = 已过工作日中空白的单元格数（填 0 不算未填）<br>
    · 数据源：钉钉 AI 表格日报表，每工作日 8:30 自动同步
  </div>`;
}

function personRows(){
  const prog=DATA.progress.pct, ppl=DATA.people, n=DATA.progress.elapsed;
  return ppl.map((p,i)=>{
    const proj=(p.rate!=null&&prog>0)?Math.min(p.rate/prog*100,999):null;
    const projTxt=proj==null?'—':(proj>999?'999%+':Math.round(proj)+'%');
    const unf=p.unfilled?`<span class="warn">${p.unfilled}天</span>`:'<span class="ok">0</span>';
    const cls=i<5?'top':(i>=ppl.length-5?'bottom':'');
    const rank=(i<5||i>=ppl.length-5)?(i+1):'';
    return `<tr class="${cls}"><td class="rank">${rank}</td>
    <td class="strong">${esc(p.name)}</td><td>${esc(p.dept_label)}</td>
    <td class="num">${fmtWan(p.completed)}</td><td class="num muted">${fmtWan(p.target)}</td>
    <td>${barHtml(p.rate,prog)}</td><td>${badgeHtml(p.rate,prog)}</td>
    <td class="num">${fmtWan(n?p.completed/n:0)}</td><td class="num">${projTxt}</td><td class="num">${unf}</td></tr>`}).join('\n')
}

function deptBcRows(){
  const prog=DATA.progress.pct, n=DATA.progress.elapsed;
  return DATA.depts.map((d,i)=>{
    const diff=d.rate-prog;
    const diffHtml=diff>=0?`<span class="badge green">领先 ${fmtPct(diff)}</span>`:`<span class="badge red">落后 ${fmtPct(-diff)}</span>`;
    const proj=prog>0?Math.min(d.rate/prog*100,999):null;
    const projTxt=proj==null?'—':(proj>999?'999%+':Math.round(proj)+'%');
    const unfTotal=d.unfilled_total;
    const unf=unfTotal?`<span class="warn">${unfTotal}天</span>`:'<span class="ok">0</span>';
    const cls=d.rate>=prog?'g':(d.rate>=prog*0.8?'y':'r');
    return `<tr><td class="rank">${i+1}</td><td class="strong">${esc(d.label)}</td>
    <td class="num">${d.count}</td>
    <td class="num">${fmtWan(d.completed)}</td><td class="num muted">${fmtWan(d.target)}</td>
    <td class="num ${cls}" style="font-weight:700">${fmtPct(d.rate)}</td>
    <td>${diffHtml}</td>
    <td class="num">${fmtWan(n?d.completed/n:0)}</td><td class="num">${projTxt}</td><td class="num">${unf}</td></tr>`}).join('\n')
}

function deptCards(){
  const prog=DATA.progress.pct, n=DATA.progress.elapsed;
  const byDept={}; DATA.people.forEach(p=>{(byDept[p.dept]=byDept[p.dept]||[]).push(p)});
  return DATA.depts.map(d=>{
    const members=[...(byDept[d.name]||[])].sort((a,b)=>(b.rate??-1)-(a.rate??-1));
    const diff=d.rate-prog;
    const diffHtml=diff>=0?`<span class="badge green">领先 ${fmtPct(diff)}</span>`:`<span class="badge red">落后 ${fmtPct(-diff)}</span>`;
    const cls=d.rate>=prog?'g':(d.rate>=prog*0.8?'y':'r');
    const mrows=members.map((m,j)=>`<tr><td class="rank">${j+1}</td><td class="strong">${esc(m.name)}</td>
      <td class="num">${fmtWan(m.completed)}</td><td class="num muted">${fmtWan(m.target)}</td>
      <td style="min-width:120px">${barHtml(m.rate,prog)}</td><td>${badgeHtml(m.rate,prog)}</td></tr>`).join('');
    return `<div class="dept-card">
      <div class="dept-head"><div><span class="dept-name">${esc(d.label)}</span>
        <span class="muted small">${d.count}人 · 目标 ${fmtWan(d.target)}</span></div>
        <div class="dept-rate ${cls}">${fmtPct(d.rate)} ${diffHtml}</div></div>
      <div class="dept-sub">累计 <b>${fmtWan(d.completed)}</b> · 人均 ${fmtWan(d.completed/d.count)} · 日均 ${fmtWan(n?d.completed/n:0)}</div>
      <table class="mini"><thead><tr><th>#</th><th>姓名</th><th>完成</th><th>目标</th><th>完成率</th><th>进度差</th></tr></thead><tbody>${mrows}</tbody></table>
    </div>`}).join('')
}

function buildTrend(){
  const s=HIST.series.filter(x=>x.overall_rate!=null);
  if(s.length<2)return'';
  const W=1000,H=44,pad=2;
  const rates=s.map(x=>x.overall_rate), progs=s.map(x=>x.progress_pct||0);
  const max=Math.max(...rates,...progs,0.05)*1.15;
  const x=i=>pad+i*(W-2*pad)/(s.length-1), y=v=>H-pad-(v/max)*(H-2*pad);
  const line=arr=>arr.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polyline points="${line(progs)}" fill="none" stroke="#c2c8d0" stroke-width="1.5"/>
    <polyline points="${line(rates)}" fill="none" stroke="#0ab561" stroke-width="2"/>
  </svg>`
}

function sw(el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  $('tab-person').style.display=el.dataset.tab==='person'?'':'none';
  $('tab-dept').style.display=el.dataset.tab==='dept'?'':'none';
}

async function load(){
  try{
    const [r1,r2]=await Promise.all([fetch('/api/leaderboard'),fetch('/api/history').catch(()=>null)]);
    if(!r1.ok){const e=await r1.json().catch(()=>({}));throw new Error(e.message||('HTTP '+r1.status))}
    DATA=await r1.json();
    HIST=r2&&r2.ok?await r2.json():null;
    render();
  }catch(e){
    $('subtitle').textContent='杭州销售完成率榜单';
    $('content').innerHTML=`<div class="state">⚠️ 暂无数据：${esc(e.message)}<br><span class="small">数据每工作日 8:30 自动同步，可稍后刷新</span></div>`;
  }
  $('refreshTip').textContent='每 5 分钟自动刷新 · 最近刷新 '+new Date().toLocaleTimeString('zh-CN');
}
load();
setInterval(load,5*60*1000);
</script>
</body></html>
