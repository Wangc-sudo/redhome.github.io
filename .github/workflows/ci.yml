name: CI

# 全量迁云后的质量门（2026-09-28 起本地环境废弃，源码唯一事实源 = 本 GitHub 仓库）。
# 三个检查全绿是合并 main 的唯一门槛；main 合并即部署意图，
# 由各 dops 主机的拉模式 CD（ops/deploy.sh + systemd timer）自拉上线，见
# docs/CICD-全量迁云方案-2026-09-28.md。CI 只读，不碰钉钉凭据与真实数据。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# 同一分支新 push 取消在跑的旧 run，省 runner、避免旧结果覆盖新结论
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 语法编译检查（common / tests / 数字化）
        run: |
          python -m compileall -q "common" "tests" "数字化"
      - name: 部署脚本语法检查
        run: |
          bash -n ops/deploy.sh
      - name: 配置模板校验
        run: |
          python - <<'EOF'
          import json, pathlib, sys
          ok = True
          for p in pathlib.Path(".").rglob("config.example.json"):
              try:
                  json.loads(p.read_text(encoding="utf-8"))
                  print(f"OK: {p}")
              except Exception as e:
                  ok = False
                  print(f"FAIL: {p}: {e}")
          sys.exit(0 if ok else 1)
          EOF

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # --build 显式重建再测：代码烤在镜像里，复用旧镜像 = 跑旧代码假绿
      # （2026-09-17 本地实测踩过：276 OK 全是旧基线，重建后才是真结果）。
      - name: 集成测试（test-runner，全量）
        run: docker compose -f docker-compose.integration.yml run --rm --build test-runner
      - name: 清理 compose 资源
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v --remove-orphans

  # 部署契约（compose / 部署脚本 / nginx conf）必须在 docker 主机上跑：
  # 这类用例靠 `docker compose config --format json` 取编排的归一化真值
  # （profile 生效面、${...:-} 默认值、端口与挂载形态），而 test-runner 容器
  # 内没有 docker CLI（INTEGRATION_TEST_RUNNER=1 会整类跳过）。2026-11-18
  # 拆分整改发现：这些契约此前在 CI 里从未真正执行过，只在装了 docker 的
  # 开发机上偶然跑过 —— 等于没有闸门。本 job 补上这个闸门，且用
  # INTEGRATION_CONTRACT_REQUIRED=1 保证「取不到 docker」时是失败而非跳过。
  compose-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 部署契约（compose config / 部署脚本 / nginx conf / 模块引用）
        env:
          INTEGRATION_CONTRACT_REQUIRED: "1"
        run: python3 -m unittest tests.test_integration_environment -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/bi-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/bi-react/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 单元测试
        run: npm run test
      - name: 构建
        run: npm run build

  # ops-web「组织编排」SPA（Vue3+Vite）。产物 static/dist 提交入库（生产不构建），
  # 本 job 保证源码可构建且 dist 与源码一致（改了源码忘了重构建 → 直接红）。
  ops-web-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: common/ops_web/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: common/ops_web/web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 构建
        run: npm run build
      - name: 校验 dist 与源码一致（产物必须随源码一起提交）
        run: git diff --exit-code -- ../static/dist

  # 单一质量门：branch protection 只需要求这一个 check。
  # 后续若加 push 式 CD / 部署回执，从这里挂。
  gate:
    runs-on: ubuntu-latest
    needs: [python-lint, python-tests, compose-contracts, frontend, ops-web-frontend]
    steps:
      - name: 质量门汇总
        run: echo "CI green on ${GITHUB_REF} (${GITHUB_SHA}) — 合并 main 即部署意图"
