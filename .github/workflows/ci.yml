name: CI

# 云迁移后启用：push / PR 时做只读质量检查（不触碰钉钉凭据与真实数据）
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 语法编译检查（全部脚本）
        run: |
          python -m compileall -q "数字化/钉钉/杭州日报机器人" "数字化/钉钉/渠道日报机器人"
      - name: 配置模板校验
        run: |
          python - <<'EOF'
          import json, pathlib, sys
          ok = True
          for p in pathlib.Path(".").rglob("config.example.json"):
              try:
                  json.loads(p.read_text(encoding="utf-8"))
                  print(f"OK: {p}")
              except Exception as e:
                  ok = False
                  print(f"FAIL: {p}: {e}")
          sys.exit(0 if ok else 1)
          EOF
