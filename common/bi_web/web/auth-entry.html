<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>访问提示 · BI 看板</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; background: #f5f6f8;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #333;
  }
  .card {
    background: #fff; border-radius: 12px; padding: 40px 48px;
    box-shadow: 0 2px 12px rgba(0,0,0,.08); max-width: 420px;
    text-align: center;
  }
  .card h1 { font-size: 20px; margin: 0 0 12px; }
  .card p { font-size: 14px; line-height: 1.8; margin: 0; color: #666; }
  .card .hint { font-size: 12px; color: #999; margin: 18px 0 8px; }
  .card input {
    display: block; width: 100%; box-sizing: border-box; margin-bottom: 8px;
    padding: 9px 10px; font-size: 14px; border: 1px solid #d9dde3;
    border-radius: 6px;
  }
  .card button {
    width: 100%; padding: 10px 0; font-size: 14px; color: #fff;
    cursor: pointer; background: #1f6feb; border: 0; border-radius: 6px;
  }
  .card .err { font-size: 12px; color: #d23f31; margin: 0 0 8px; }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">需要登录</h1>
  <p id="message">请从钉钉工作台打开本看板。</p>
  <!-- 浏览器登录：默认隐藏，仅当本端提供该通道时由脚本揭示（bi-web 无此
       路由，共享入口页对 bi-web 外观零变化）。

       两套通道互斥显示，密码通道优先：
       * 工号 + 密码（2026-10-19 用户裁决）——用户名=工号，密码=系统生成
         的随机初始密码，可自改；
       * 旧运维口令通道——仅作为密码通道不可用时的逃生口保留。 -->
  <form id="passwordLogin" hidden>
    <p class="hint">无钉钉环境时，可用工号登录。</p>
    <input id="plJob" type="text" placeholder="工号"
           autocomplete="username">
    <input id="plPass" type="password" placeholder="密码"
           autocomplete="current-password">
    <p id="plErr" class="err" hidden></p>
    <button type="submit">登录</button>
  </form>

  <form id="passwordChange" hidden>
    <p class="hint">首次登录（或密码刚被重置），请先设置新密码。</p>
    <input id="pcOld" type="password" placeholder="当前密码"
           autocomplete="current-password">
    <input id="pcNew" type="password" placeholder="新密码（至少 10 位）"
           autocomplete="new-password">
    <p id="pcErr" class="err" hidden></p>
    <button type="submit">设置并进入</button>
  </form>

  <form id="browserLogin" hidden>
    <p class="hint">无钉钉环境时，可用运维口令登录。</p>
    <input id="blUser" type="text" placeholder="钉钉账号（userid）"
           autocomplete="username">
    <input id="blToken" type="password" placeholder="运维口令"
           autocomplete="current-password">
    <p id="blErr" class="err" hidden></p>
    <button type="submit">登录</button>
  </form>
</div>
<script src="https://g.alicdn.com/dingding/dingtalk-jsapi/2.7.13/dingtalk.open.js"></script>
<script>
  // reason 只切换固定文案，绝不回填到 DOM——提示页无反射面。
  var messages = {
    login: ["需要登录", "请从钉钉工作台打开本看板。"],
    unauthorized: ["暂未授权", "您还没有看板访问权限，请联系管理员开通。"],
    forbidden: ["无权访问此页", "该看板需要额外权限，请联系管理员开通。"],
    loggedout: ["已退出", "您已安全退出。重新访问请从钉钉工作台打开。"]
  };
  var params = new URLSearchParams(location.search);
  var reason = params.get("reason") || "login";
  var entry = messages[reason] || messages.login;
  document.getElementById("title").textContent = entry[0];
  document.getElementById("message").textContent = entry[1];

  // M4 钉钉容器内自动免登（设计稿 §5.1）：仅未登录（reason=login）且
  // 运行在钉钉 UA 内时触发；unauthorized/forbidden/loggedout 不再自动
  // 尝试（已有身份被准入门拦、或刚登出——再登一次只会兜圈）。
  (function () {
    if (reason !== "login") return;
    if (!/DingTalk/i.test(navigator.userAgent) || typeof dd === "undefined") return;

    // next 仅接受「单斜杠开头的站内路径」，其余一律回根页——不进 DOM、
    // 不参与拼接，只作 location.href 的目的地。
    var next = params.get("next") || "/";
    if (next.charAt(0) !== "/" || next.charAt(1) === "/") next = "/";

    function fail() {
      document.getElementById("title").textContent = "免登失败";
      document.getElementById("message").textContent =
        "钉钉免登未成功，请稍后重试或联系管理员。";
    }

    fetch("/auth/jsapi-config?url=" + encodeURIComponent(location.href.split("#")[0]),
          { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("jsapi-config " + r.status);
        return r.json();
      })
      .then(function (cfg) {
        dd.config({
          agentId: cfg.agentId,
          corpId: cfg.corpId,
          timeStamp: cfg.timeStamp,
          nonceStr: cfg.nonceStr,
          signature: cfg.signature,
          jsApiList: ["runtime.permission.requestAuthCode"]
        });
        dd.ready(function () {
          dd.runtime.permission.requestAuthCode({
            corpId: cfg.corpId,
            onSuccess: function (result) {
              fetch("/auth/dingtalk", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ authCode: result.code }),
                cache: "no-store"
              }).then(function (r) {
                if (r.ok) { location.href = next; return; }
                // 已登录但被准入门拦：换提示文案为「暂未授权」。
                if (r.status === 403) {
                  document.getElementById("title").textContent = messages.unauthorized[0];
                  document.getElementById("message").textContent = messages.unauthorized[1];
                  return;
                }
                fail();
              }).catch(fail);
            },
            onFail: fail
          });
        });
        dd.error(fail);
      })
      .catch(fail);
  })();

  // 浏览器登录表单（2026-10-14）：先探 /auth/login-options，只有本端开放了
  // 该通道才揭示表单；提交成功后回到 next（与钉钉免登同一枚 session cookie）。
  // 工号 + 密码（2026-10-19）：通道可用则优先显示；否则退回旧运维口令
  // 通道。首登（must_change）就地切到改密表单，改完再进 next。
  (function () {
    var pwForm = document.getElementById("passwordLogin");
    var pwErr = document.getElementById("plErr");
    var chForm = document.getElementById("passwordChange");
    var chErr = document.getElementById("pcErr");
    var browserForm = document.getElementById("browserLogin");

    function nextPath() {
      var n = params.get("next") || "/";
      if (n.charAt(0) !== "/" || n.charAt(1) === "/") n = "/";
      return n;
    }

    fetch("/auth/login-options", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (cfg) {
        if (cfg && cfg.password) { pwForm.hidden = false; return; }
        if (cfg && cfg.browser) browserForm.hidden = false;
      })
      .catch(function () {});

    pwForm.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var job = document.getElementById("plJob").value.trim();
      var pass = document.getElementById("plPass").value;
      if (!job || !pass) {
        pwErr.textContent = "请填工号与密码。";
        pwErr.hidden = false;
        return;
      }
      fetch("/auth/password-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ job_number: job, password: pass }),
        cache: "no-store"
      }).then(function (r) {
        if (!r.ok) {
          pwErr.textContent = (r.status === 503)
            ? "本端未开放密码登录。"
            : "工号或密码不正确。";
          pwErr.hidden = false;
          return null;
        }
        return r.json();
      }).then(function (data) {
        if (!data) return;
        if (data.must_change) {
          pwForm.hidden = true;
          chForm.hidden = false;
          document.getElementById("title").textContent = "请先设置密码";
          document.getElementById("message").textContent =
            "为安全起见，请先把初始密码改成自己的密码。";
          document.getElementById("pcOld").value = pass;
          return;
        }
        location.href = nextPath();
      }).catch(function () {
        pwErr.textContent = "登录请求失败，请稍后重试。";
        pwErr.hidden = false;
      });
    });

    chForm.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var old = document.getElementById("pcOld").value;
      var neu = document.getElementById("pcNew").value;
      if (!old || !neu) {
        chErr.textContent = "请填当前密码与新密码。";
        chErr.hidden = false;
        return;
      }
      fetch("/auth/change-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ old_password: old, new_password: neu }),
        cache: "no-store"
      }).then(function (r) {
        if (r.ok) { location.href = nextPath(); return; }
        chErr.textContent = (r.status === 400)
          ? "新密码不合要求（至少 10 位）。"
          : "当前密码不正确。";
        chErr.hidden = false;
      }).catch(function () {
        chErr.textContent = "改密请求失败，请稍后重试。";
        chErr.hidden = false;
      });
    });
  })();

  (function () {
    var form = document.getElementById("browserLogin");
    var err = document.getElementById("blErr");

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var user = document.getElementById("blUser").value.trim();
      var token = document.getElementById("blToken").value;
      if (!user || !token) {
        err.textContent = "请填账号与运维口令。";
        err.hidden = false;
        return;
      }
      var next = params.get("next") || "/";
      if (next.charAt(0) !== "/" || next.charAt(1) === "/") next = "/";
      fetch("/auth/browser-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: user, token: token }),
        cache: "no-store"
      }).then(function (r) {
        if (r.ok) { location.href = next; return; }
        err.textContent = (r.status === 503)
          ? "本端未开放浏览器登录。"
          : "账号或运维口令不正确。";
        err.hidden = false;
      }).catch(function () {
        err.textContent = "登录请求失败，请稍后重试。";
        err.hidden = false;
      });
    });
  })();
</script>
</body>
</html>
