<!DOCTYPE html>
<!-- bi-web 公共骨架（阶段 B）：样式与脚本均为本地静态资源；
     ECharts 仅由浏览器侧从 CDN 拉取（服务端零出网），版本锁定 5.5.1。 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ dashboard.title }}</title>
    <link rel="stylesheet" href="/static/style.css" />
    <!--
      BI_WEB_TOKEN 模式面向 curl / API 消费：浏览器无法自带 Authorization 头，
      带令牌启动时 /d/ 页面与卡片接口会返回 401——这是预期行为，不是缺陷。
    -->
    <script defer src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  </head>
  <body>
    {%- if nav %}
    <nav class="topnav">
      {%- for entry_id, entry_title in nav %}
      <a class="topnav-link{{ ' current' if entry_id == dashboard.dashboard_id else '' }}"
         href="/d/{{ entry_id }}">{{ entry_title }}</a>
      {%- endfor %}
    </nav>
    {%- endif %}
    {% block content %}{% endblock %}
    <script src="/static/dashboard.js"></script>
  </body>
</html>
