# vsftpd 配置：仅本地账号、禁匿名、chroot 到家目录（资源仓文件在
# 家目录 files/ 子目录，即共享卷 bi-static 挂载点）。
listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
# 上传账号是 nologin 服务账号（不该有交互 shell）：关掉 /etc/shells 校验，
# 否则 PAM 判 530 Login incorrect。
check_shell=NO
write_enable=YES
# 上传产物要给 nginx（其他 uid）直读：vsftpd 默认 umask 077 会落成
# 600/700 → nginx 403；统一 022/0644。
local_umask=022
file_open_mode=0644
chroot_local_user=YES
allow_writeable_chroot=YES
utf8_filesystem=YES
xferlog_enable=YES
seccomp_sandbox=NO
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30009
pasv_address=127.0.0.1
