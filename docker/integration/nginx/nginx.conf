# bi-web 对外反代（局域网访问入口）
# 职责：gzip 压缩 + 静态产物长缓存 + 反向代理到 bi-web:8080
# 只做传输层优化，不改动任何业务路由语义。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # ---------- 压缩：bi-web 本身无 GZipMiddleware，1.06MB echarts 全靠这一层
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        # Python StaticFiles 对 .js 返回 text/javascript，必须列上，
        # 否则 echarts 1.06MB 不会被压缩
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml;

    upstream bi_web {
        server bi-web:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 10m;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 构建产物文件名带 hash：可安全长缓存（echarts 1.06MB → 只下一次）
        location ^~ /assets/ {
            proxy_pass http://bi_web;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # 静态资源仓（FTP 上传 → 共享卷只读直出，2026-09-17）：
        # 小图标 / SVG 矢量图一类。无 hash 文件名（上传会覆盖），短缓存；
        # gzip_types 已含 image/svg+xml；不过 bi-web，直连共享卷（快速）。
        location ^~ /static/ {
            alias /srv/static/;
            add_header Cache-Control "public, max-age=300";
        }

        # 看板壳 /d/{id} 与全部 /api：保持后端 no-store 语义不变
        location / {
            proxy_pass http://bi_web;
        }
    }
}
