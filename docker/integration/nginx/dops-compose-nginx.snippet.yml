
  # 榜单静态页发布（2026-09-23 提前拉起）：serve pages-output，host 网络占 80。
  # 仅静态文件，无 upstream；bi-web 反代待 BI 上云后再加 server 块。
  nginx:
    image: nginx:1.27-alpine
    container_name: dops-nginx
    network_mode: host
    restart: unless-stopped
    volumes:
      - /opt/dops/nginx/pages.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/dops/pages-output:/usr/share/nginx/html:ro
