# dops-app 榜单页面对外发布（临时通道，替代待决策的 OSS/CDN）
# 主链路（2026-10-13 cron 解耦）：榜单页反代 pages-web 请求时渲染；渲染
# 失败由服务内磁盘 last-good 兜底，服务整体挂掉 → 502/504 → @static 吃
# last-good 静态文件，页面不断供。no-store 维持（内容随请求推进）。
# 例外：hangzhou.html 仍走 2026-10-09 运维裁决的 BI 看板桥（bi-web 宿主
# 环回 18080），保持线上现网行为不回退；如需统一切 pages-web，删下方
# 「BI 看板桥」四段即可（静态 hangzhou.html 文件仍在 pages-output）。
server {
    # 80/443 未过 ICP 备案被运营商层拦截（2026-09-23 实测 SG 全放仍不通），
    # 临时用 8300 对外（对齐旧榜单服务端口约定）；备案完成后切回 80/443。
    listen 8300 default_server;
    server_name _;

    root /usr/share/nginx/html;
    autoindex off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/html;

    # 裸域名便利性跳转：默认落到杭州榜（当前唯一有真群流量区域）
    location = / {
        return 302 /hangzhou.html;
    }

    # —— 杭州线下销售 BI 看板桥（2026-10-09 运维裁决，线上现网行为，保留）——
    # 仅此看板经 8300 暴露，其余看板仍锁 18080 办公网白名单。
    location = /hangzhou.html {
        proxy_pass http://127.0.0.1:18080/d/hz-offline-sales;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }
    # BI 壳静态资源（bi.html/bi.js/bi-data.js/bi.css 等，无数据面）
    location /web/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }
    # BI API 白名单：仅杭州看板的定义/卡片 + dates 筛选值域——其他看板的
    # /api/v1/d/* 与导航列表 /api/v1/dashboards 一律不代理（命中下方静态
    # location 得 404，客户端 buildNav 失败静默降级为无顶栏的独立大屏）。
    location = /api/v1/dashboards/hz-offline-sales {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
    }
    location ~ ^/api/v1/d/hz-offline-sales/cards/[a-z0-9_]+$ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
    }
    location = /api/v1/options/dates {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
    }

    # —— 渠道销售 BI 看板桥（2026-10-13 裁决，同杭州方案 A）——
    # 8300/qudao.html 保留原 URL，内容为渠道 BI 壳；/web/ 与 options/dates
    # 复用上方共享 location。精确匹配优先于下方 pages-web 切流正则。
    location = /qudao.html {
        proxy_pass http://127.0.0.1:18080/d/qd-channel-sales;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }
    location = /api/v1/dashboards/qd-channel-sales {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
    }
    location ~ ^/api/v1/d/qd-channel-sales/cards/[a-z0-9_]+$ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
    }

    # —— 榜单页请求时渲染：反代 pages-web（宿主环回 18090）——
    # 正则含 {}，nginx 配置解析要求整段加引号，否则 nginx -t emerg
    # （2026-10-13 实测：HUP 静默失效、切流不生效，且 nginx 重启会启动失败）。
    location ~ "^/[a-z0-9_]+(-\d{4}-\d{2}-\d{2})?\.html$" {
        proxy_pass http://127.0.0.1:18090;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 502 504 = @static;
        add_header Cache-Control "no-store";
    }
    location @static {
        try_files $uri =503;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }
}
