# dops-app 榜单页面对外发布（临时通道，替代待决策的 OSS/CDN）
# 服务 /opt/dops/pages-output 下 pages-* 管线每日 08:30 再生的静态 HTML。
# 文件名固定且内容每日覆盖，必须 no-store 防浏览器/中间缓存吃旧榜。
server {
    # 80/443 未过 ICP 备案被运营商层拦截（2026-09-23 实测 SG 全放仍不通），
    # 临时用 8300 对外（对齐旧榜单服务端口约定）；备案完成后切回 80/443。
    listen 8300 default_server;
    server_name _;

    root /usr/share/nginx/html;
    autoindex off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/html;

    # 裸域名便利性跳转：默认落到杭州榜（当前唯一有真群流量区域）
    location = / {
        return 302 /hangzhou.html;
    }

    location / {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }
}
