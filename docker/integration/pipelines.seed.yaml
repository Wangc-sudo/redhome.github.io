# Version-controlled seed for the pipeline registry (spec section 3).
#
# Publish to Nacos with:
#   python -m common.public_data.cli publish-pipelines --seed docker/integration/pipelines.seed.yaml
#
# After the first publish the Nacos entries are authoritative; this file is
# (a) the fallback used when Nacos is unreachable and (b) the default for a
# fresh environment.  Keys are service ids; the data-id is "<key>.yaml" in
# the "PIPELINES" group under the environment's namespace.
#
# category（功能分类真源，七值：同步/加工/播报/催办/页面/钉钉/平台）——
# 2026-10-07 起落库；未配置时读路径按 service_id 推导兜底
# （common.public_data.pipeline_taxonomy）。
roll-manifest:
  kind: apps
  category: 同步
  enabled: true
  schedule: "55 1,6,13,15 * * *"
  reads: []
  description: "rolls the source manifest's WDT windows forward (runs before each sync round)"
sync-dingtalk:
  kind: apps
  category: 同步
  enabled: true
  sources: [dingtalk]
  schedule: "0 2,7,14,16 * * *"
  sla: "16:45"
  reads: [raw_dingtalk, mart_ops]
  depends_on: [roll-manifest]
  description: "DingTalk AI sheets -> raw_dingtalk"
sync-wdt:
  kind: apps
  category: 同步
  enabled: true
  sources: [wdt]
  schedule: "0 2,7,14,16 * * *"
  sla: "16:45"
  reads: [raw_wdt, mart_ops]
  depends_on: [roll-manifest]
  description: "WDT read APIs -> raw_wdt"
project-mart:
  kind: apps
  category: 加工
  enabled: true
  schedule: "0 3 * * *"
  reads: [raw_dingtalk, raw_wdt, mart_ops]
  description: "raw -> mart_ops projection rebuild"
extract-mart:
  kind: apps
  category: 加工
  enabled: true
  schedule: "0 4,8,15,17 * * *"
  sla: "17:45"
  reads: [raw_dingtalk, mart_ops]
  description: "raw_dingtalk -> mart_ops extraction (facts + dim_calendar)"
dq-rerun-worker:
  kind: apps
  category: 加工
  enabled: true
  schedule: "* * * * *"
  reads: [raw_dingtalk, raw_wdt, mart_ops]
  description: "consumes one pending frozen data-quality rerun per tick (dry-run or formal publish)"
# robot 一拆二（2026-10-07 裁决）：robot-<区域>=填报提醒(18:00)，
# robot-check-<区域>=催办未填人+DING(20:00)，独立注册/调度/可手动运行，
# 手动触发不再受 mart_cli once 的小时分流限制。
channel-daily-qudao:
  kind: business
  category: 播报
  enabled: false
  schedule: "30 8 * * *"
  reads: [mart_ops]
  description: "qudao channel daily report broadcast - 已并入 qudao 榜单页（渠道日销快报板块），2026-09-23 停单独播报"
sync-channel-sales:
  kind: apps
  category: 同步
  enabled: true
  schedule: "31 10 * * *"
  sla: "11:00"
  reads: [raw_dingtalk, mart_ops]
  description: "渠道日销 T+1 补采（dingtalk channel_daily_sales* + channel_monthly_target）"
extract-channel:
  kind: apps
  category: 加工
  enabled: true
  schedule: "35 10 * * *"
  sla: "11:00"
  reads: [raw_dingtalk, mart_ops]
  depends_on: [sync-channel-sales]
  description: "渠道日销 T+1 提取（fact_channel_daily_sales + fact_channel_store_target，点名册依赖）"
dq-check-channel:
  kind: apps
  category: 加工
  enabled: true
  schedule: "50 10 * * *"
  reads: [raw_dingtalk, mart_ops]
  depends_on: [extract-channel]
  description: "渠道日销只读质量检查（规则、异常与运行摘要落 dq_* 控制表）"
dq-check-wdt:
  kind: apps
  category: 加工
  enabled: true
  schedule: "30 18 * * *"
  reads: [raw_wdt, mart_ops]
  depends_on: [extract-mart]
  description: "WDT 订单行只读质量检查（解析、必填、重复与拉空）"
# 渠道日销·订单口径（2026-10-23 第 3 步）：不读 AI 表，直接把 fact_order_line
# 按 dim_channel_map 聚合成 fact_channel_order_daily。与上面的人工填报口径
# 双轨并存（对账期），退役人工口径是第 4 步、需运维裁决。
# 时间放在 extract-mart（17:00）之后——fact_order_line 由它重建。
channel-order-daily:
  kind: apps
  category: 加工
  enabled: true
  schedule: "0 19 * * *"
  reads: [mart_ops]
  description: "渠道日销·订单口径聚合（fact_order_line -> fact_channel_order_daily）"
channel-missing-check:
  kind: business
  category: 催办
  # @ 映射 0%（电商 19 负责人不在 dim_robot_member，2026-10-13 实测）：
  # 当前发纯文本缺口表无人被 @；映射修复（电商部门纳入组织同步投影或
  # recipient_override）单独立项。
  enabled: true
  schedule: "40 10 * * *"
  reads: [mart_ops]
  depends_on: [extract-channel]
  description: "渠道门店到齐校验与催办（region=qudao，同步失败 fail-closed 跳过）"
freshness-check:
  kind: business
  category: 催办
  # A3 L3 数据新鲜度看门狗（2026-10-15 裁决）：断言 fact_channel_daily_sales
  # 与 fact_daily_report_offline(region=qudao) 存在 business_date=T-1 的行
  # （禁用 max>=T-1——AI 表格含未来日期，10 月 max 已达 10-31）。缺则经
  # C5 通用巡检告警通道（outbox kind=alert）发到运维群 region=ops；
  # T-1 非工作日只抑制告警、照常检查。
  enabled: true
  schedule: "0 11 * * *"
  sla: "11:30"
  reads: [mart_ops]
  depends_on: [extract-channel]
  # 告警口径（ops-web「告警设置」可改；真源落 Nacos 本条目 params）：
  params: {alert_threshold: warning, alert_cooldown_hours: 24}
  description: "L3 数据新鲜度看门狗：渠道两表缺 T-1 行即告警（region=ops）"
calendar-watch:
  kind: business
  category: 播报
  enabled: true
  schedule: "0 10 25 * *"
  reads: [mart_ops]
  description: "workday-calendar coverage watch (current+next month gap / rule_fallback alert)"
fleet-audit:
  kind: business
  category: 平台
  enabled: true
  schedule: "0 7 2 * *"
  reads: [mart_ops]
  description: "monthly fleet governance audit snapshot (disabled/zombie/decorative-deps/pileup -> pd_ops_fleet_audit, ops-web drawer only)"
dingtalk-gateway:
  kind: apps
  category: 钉钉
  enabled: true
  reads: [mart_ops]
  description: "robot_outbox delivery + DingTalk interaction gateway"
# sync-runner 已归档（2026-10-19 治理 P2 裁决：Nacos 摘除 + seed 删条目 +
# git 历史即档案；legacy 合并同步早被 sync-dingtalk/sync-wdt 取代）。
bi-web:
  kind: business
  category: 平台
  enabled: true
  reads: [mart_ops]
  description: "BI dashboards (L1/L2), read-only on mart_ops"
scheduler:
  kind: apps
  category: 平台
  enabled: true
  reads: [raw_dingtalk, raw_wdt, mart_ops]
  description: "fires registered pipelines on their registry cron schedules (no own schedule)"
# --- 知识库问答机器人（2026-10-10，客服部门；独立应用独立 Stream 连接） ---
kb-sync-products:
  kind: apps
  category: 同步
  enabled: true
  schedule: "7 * * * *"
  reads: [mart_ops]
  description: "product knowledge-base sync (DingTalk aitable -> mart_ops kb_products)"
# 2026-10-21：wiki/doc OpenAPI 已授权（知识库读/节点读/企业存储文件读），
# 知识库文档自动同步——遍历可见知识库 → blocks→markdown → 双写清单 JSON
# （rag-index-docs 03:17 灌向量库）与 kb_doc_chunks（BM25 通路）。
# 03:10 跑，先于 rag-index-docs 03:17 完成（两库文档量小，分钟级）。
kb-sync-wiki:
  kind: apps
  category: 同步
  enabled: true
  schedule: "10 3 * * *"
  reads: [mart_ops]
  description: "wiki docs sync (DingTalk wiki/doc OpenAPI -> kb_docs.json + kb_doc_chunks)"
# 统一数据集新鲜度检查（2026-10-29 自动化闭环 P0）：按契约检查全部业务
# 数据集，结果落 pd_dataset_freshness，供 ops-web 系统后台统一展示。
dataset-freshness-check:
  kind: apps
  category: 加工
  enabled: true
  schedule: "0 6,12,18,23 * * *"
  reads: [mart_ops]
  depends_on: [extract-mart]
  description: "dataset freshness check against versioned contracts (raw/mart/window/reconcile)"
kb-export-cleanup:
  kind: apps
  category: 平台
  enabled: true
  schedule: "17 * * * *"
  reads: [mart_ops]
  description: "expire KB XLSX exports and remove expired files"
# --- RAG 向量索引（2026-10-12 第一期：商品+图片跨模态检索） ---
# 2026-10-20 降频为每日一次：每小时全量重灌 825 行图文（每次数百次
# embedding 调用、十几分钟）纯浪费——商品资料非高频变动，每日 03:47 足够；
# 与 rag-index-docs（03:17）错开，避免 Milvus Lite 文件锁撞车。
# embedding provider 走 RAG_EMBED_*（2026-10-20 起为天翼 qwen3-vl-embedding）。
rag-index-products:
  kind: apps
  category: 同步
  enabled: true
  schedule: "47 3 * * *"
  reads: [mart_ops]
  depends_on: [kb-sync-products]
  description: "RAG vector index (DingTalk aitable -> embedding -> Milvus Lite)"
# RAG 第二期（2026-10-19）：知识库文档（销售总结/规划/制度等）按标题结构
# 切片后写进同一个 collection，与商品图文同向量空间、同检索入口混排召回。
# 数据源 = 本地清单 JSON（钉钉 doc/wiki OpenAPI 未授权，本机 dws 导出后导入）；
# 缺 RAG_EMBED_API_KEY 或缺清单文件时打印 skipped 静默跳过。
rag-index-docs:
  kind: apps
  category: 同步
  enabled: true
  schedule: "17 3 * * *"
  reads: []
  depends_on: [kb-sync-wiki]
  description: "RAG vector index for docs (DingTalk knowledge-base markdown -> embedding -> Milvus Lite)"
# 猫超价格竞争力（2026-11-03 P0）：先手动影子验收，定时默认关闭。
# Windows agent 单实例操作可见 Chrome；活跃任务唯一性由 DB 保证，scheduler
# 的短生命周期锁只约束派发子进程，不承担 Windows 执行期防重。
price-maochao-dispatch:
  kind: apps
  category: 同步
  enabled: false
  schedule: "*/10 * * * *"
  reads: [mart_ops]
  description: "create one Maochao price-collection job for the Windows edge agent"
price-maochao-finalize:
  kind: apps
  category: 加工
  enabled: false
  schedule: "* * * * *"
  reads: [mart_ops]
  description: "expire Maochao agent leases/login waits and enqueue timeout alerts"
