# dops-ntp chronyd 配置
# 角色：上游公网对时（百度 + 清华 TUNA），下游私网授时。

# ---- 上游：公网 NTP ----
# iburst 启动时快速连发 4 包，容器重启后数秒内完成首轮同步。
# 2026-09-23 天翼云实测：百度（180.97.214.93/180.101.49.12/内网镜像
# 10.48.49.44）与清华 TUNA（101.6.6.101）UDP/123 出向全部被丢包不可用，
# 阿里云/腾讯云公共 NTP 稳定（rtt<30ms），故上游取这两个可达公网源。
server ntp.aliyun.com iburst prefer
server ntp1.aliyun.com iburst
server time1.cloud.tencent.com iburst

# ---- 时钟驯化 ----
driftfile /var/lib/chrony/chrony.drift
# 前 3 次更新若偏差 >1s 直接步进（容器/宿主机重启后快速拉回，不慢慢蠕调）
makestep 1.0 3
# 内核每 11 分钟同步 RTC（宿主机重启后硬件钟不至于差太远）
rtcsync

# ---- 下游授时：仅回环 + 私网网段 ----
# 公网 UDP/123 不开（云 SG 也不放），防被当 NTP 放大反射源
allow 127.0.0.1
allow 10.0.0.0/8
allow 172.16.0.0/12
allow 192.168.0.0/16

# 上游全断时仍对下游自报时间（stratum 10 低优先级，下游有更好源会自动切走），
# 避免外网故障时内网集体失去时间源
local stratum 10 orphan

logdir /var/log/chrony
