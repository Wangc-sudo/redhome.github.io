# 看板编排种子：卡片口径在 common/bi_web/cards.py（代码评审）；本文件只回答
# 「哪个页面摆哪些卡、什么标题、什么布局、是否启用」。发布进 Nacos group=BI。
# 阶段 B：nav_order 驱动顶部导航；filters 驱动筛选条；on_click 驱动 bar 下钻。
l1-cockpit:
  title: "首页驾驶舱"
  icon: "/static/icons/cockpit.svg"
  group: "经营驾驶舱"
  enabled: true
  refresh_seconds: 86400
  nav_order: 0
  # 结果（本月累计 / 目标达成）→ 变化（趋势、排行、渠道对比）→
  # 日环比降为条线级辅助信息，不再占据首屏第一排。
  cards:
    - card: kpi_offline_mtd
      title: "线下本月累计销售"
      span: 4
    - card: kpi_channel_mtd
      title: "电商渠道本月累计销售"
      span: 4
    - card: kpi_annual_progress
      title: "年度目标达成进度"
      span: 4
    - card: trend_region_daily
      title: "区域日销趋势"
      span: 8
    - card: bar_channel_mtd
      title: "渠道本月排行"
      span: 4
    - card: table_channel_mtd
      title: "渠道本月对比"
      span: 12
    - card: pie_sku_mtd
      title: "电商 SKU 本月销售占比"
      span: 6
    # 派生口径（CubeSchema §2）由后端算：缺口/所需日均/四级告警，前端只渲染。
    - card: anomaly_top
      title: "今日跟进（缺口 TOP10）"
      span: 6
    - card: kpi_shortfall
      title: "目标缺口与告警"
      span: 6
    - card: kpi_offline_dod
      title: "线下日环比"
      span: 3
    - card: kpi_channel_dod
      title: "电商渠道日环比"
      span: 3
# 杭州线下销售BI看板（2026-10-09 运维裁决：8300/hangzhou.html 静态榜单页
# 切 BI，URL 保留走 nginx 反代方案 A——仅此看板经 8300 暴露，其余看板仍锁
# 18080 办公网白名单）。区域钉死杭州；全卡锚定 date（工作日日历点选，蓝=
# 工作日）；BI 实时口径含当天已报（与静态页 T-1 刻意不同）。300s 自动刷新
# 满足常亮大屏；浅色管理台风（深色大屏主题裁决不做）。
hz-offline-sales:
  title: "杭州线下销售BI看板"
  icon: "/static/icons/people.svg"
  group: "经营驾驶舱"
  enabled: true
  refresh_seconds: 300
  nav_order: 5
  filters:
    - {param: date, source: dates, label: "日期"}
  cards:
    - card: kpi_hz_mtd
      title: "本月累计销售"
      span: 4
    - card: kpi_hz_today
      title: "当日销售"
      span: 4
    - card: kpi_hz_progress
      title: "时间进度"
      span: 4
    - card: trend_hz_daily
      title: "杭州日销趋势"
      span: 8
    - card: bar_hz_dept
      title: "部门本月排行"
      span: 4
    - card: table_hz_people_progress
      title: "个人完成率榜"
      span: 12
    # 当日未填报人（2026-10-10 运维反馈新增；与催办同真源）
    - card: table_hz_unfilled_today
      title: "当日未填报人"
      span: 12
# 线下整体销售BI看板（2026-10-10 运维裁决：8300/offline_all.html 静态榜
# 单页切 BI，URL 保留走 nginx 反代方案 A——同 hangzhou.html 先例，仅此
# 看板与杭州看板经 8300 暴露，其余看板仍锁 18080 办公网白名单）。汇总卡
# = 线下线全域（与 L1 驾驶舱同源，vanke 按裁决不计入）；人员/部门/板块
# 卡真源 = 群播报/静态页同函数（collect_offline_all_people / AGG_SCOPES）。
# 全卡锚定 date（工作日日历点选）；BI 实时口径含当天已报（与静态页 T-1
# 刻意不同）。300s 自动刷新（常亮大屏，同杭州看板）。
offline-all-sales:
  title: "线下整体销售BI看板"
  icon: "/static/icons/people.svg"
  group: "经营驾驶舱"
  enabled: true
  refresh_seconds: 300
  nav_order: 6
