    - {param: date, source: dates, label: "日期"}
  cards:
    - card: kpi_oa_mtd
      title: "本月累计销售"
      span: 4
    - card: kpi_oa_today
      title: "当日销售"
      span: 4
    - card: kpi_oa_progress
      title: "时间进度"
      span: 4
    - card: trend_oa_daily
      title: "区域日销趋势"
      span: 8
    - card: bar_oa_dept
      title: "部门本月排行"
      span: 4
    - card: table_oa_scopes
      title: "板块日/周/月总览"
