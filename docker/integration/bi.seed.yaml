# 资金安全（需求⑩）：五张 fact_fin_* 真卡，编排照 fund-safety-draft §4；
# 派生口径（>60 天差额桶/挂账天数/severity）全部后端算（fin_derived）。
l2-fund-safety:
  title: "资金安全"
  # 静态资源仓（FTP → nginx /static/）链路样例：SVG 矢量图标。
  icon: "/static/icons/fund.svg"
  group: "专项分析"
  enabled: true
  refresh_seconds: 86400
  nav_order: 40
  # 公司主体筛选（2026-09-17 P2）：38 家店铺挤一张图 = 38 条 series 不可读，
  # 而主体会变（新增/改名/下线），故 4 张硬编码分屏卡收敛为 1 张参数化卡 +
  # entities 筛选源；entity 空 = 全主体按渠道汇总。
  filters:
    - param: entity
      source: entities
      label: "公司主体"
  cards:
    - card: kpi_fin_receivables_overdue
      title: "应收逾期总览"
      span: 4
    - card: trend_fin_store_funds_entity
      title: "店铺资金余额趋势"
      span: 12
    - card: table_fin_receivables_aging
      title: "应收账龄明细"
      span: 12
    - card: table_fin_prepayment_uninvoiced
      title: "预付与未到票"
      span: 6
    - card: table_fin_deposit_status
      title: "保证金状态"
      span: 6
