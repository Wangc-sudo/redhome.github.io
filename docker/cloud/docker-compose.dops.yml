# dops 容器组（dops-app 宿主机，/opt/dops/docker-compose.dops.yml）
# 版本受控：本文件（repo docker/cloud/）为唯一真源，服务器 /opt/dops/ 下为
# 部署副本——改动走 git，发布 = 同步本文件 + compose up -d（注意：restart
# 不应用 env_file 变更，改 app.env 必须 up -d 重建容器）。
# 设计：镜像只做运行时（python3 + requirements 依赖），代码经 /opt/dops/repo
# 挂卷进容器（working_dir 即仓库根）。日常迭代 = scp 代码 + compose restart，
# 不重构镜像；仅 requirements.txt 变更才重建（--build-arg PIP_INDEX_URL）。
name: dops

services:
  gateway:
    image: dops-app:latest
    container_name: dingtalk-gateway
    network_mode: host
    restart: unless-stopped
    env_file: /opt/dops/app.env
    working_dir: /opt/dops/repo
    environment:
      TZ: Asia/Shanghai
      PYTHONDONTWRITEBYTECODE: "1"
    entrypoint: ["python3"]
    command:
      - -m
      - common.gateway.cli
      - run
      - --live-send
      - --confirm-local-test-write
      # 2026-11-18 换流：同一钉钉应用（dingnlvj7z51xcoafbjl）只允许一条
      # Stream 长连接，线下报数已由 dops-offline-gateway 接管，本进程只保留
      # robot_outbox → 钉钉 的投递职责。恢复渠道 Stream 时把这一行加回，
      # 并确认 offline 侧报数进程已停（两条连接会互相抢事件）。
      - --live-read
      - --source-credentials
      - /run/live-input/source-credentials.json
    volumes:
      - /opt/dops/repo:/opt/dops/repo:ro
      - /opt/dops/config-local:/opt/dops/config-local:ro
      - /opt/dops/live/gateway-credentials.json:/run/live-input/source-credentials.json:ro
      - /opt/dops/live:/opt/dops/live:ro

  scheduler:
    image: dops-app:latest
    container_name: dops-scheduler
    network_mode: host
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1536m
    pids_limit: 256
    env_file: /opt/dops/app.env
    working_dir: /opt/dops/repo
    environment:
      TZ: Asia/Shanghai
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PUBLIC_DATA_PRICE_AGENT_SEED: /opt/dops/repo/docker/integration/price-agent-maochao.yaml
      # 线上渠道批处理由独立 channel-scheduler 发布与执行，主调度不得重复认领。
      SCHEDULER_SERVICE_EXCLUDE_FILE: /opt/dops/repo/ops/channel-release.json
      SCHEDULER_SERVICE_EXCLUDE: "leaderboard-hangzhou,leaderboard-shaoxing,leaderboard-vanke,leaderboard-offline_all,offline-daily-summary,pages-hangzhou,pages-junpin,pages-offline_all,pages-shaoxing,pages-vanke,robot-hangzhou,robot-junpin,robot-offline_all,robot-shaoxing,robot-vanke,robot-check-hangzhou,robot-check-junpin,robot-check-offline_all,robot-check-shaoxing,robot-check-vanke,target-remind,target-rollover"
      # 线下业务线已剥离到 offline-branch 仓（2026-11-18）：区域报数/名册目标/
      # 人员榜单/提醒催办/线下整体日报/榜单页渲染的调度所有权移交
      # dops-offline-scheduler（其编排用 SCHEDULER_SERVICE_INCLUDE_FILE 只认领
      # 这 22 条）。本调度器不得重复认领，否则双播报、双写 robot_outbox。
      # 清单真源 = offline-branch 仓 ops/offline-release.json 的 scheduler_services；
      # 与上面的渠道清单文件取并集（common.public_data.scheduler.service_scope）。
      # 业务开关与嵌入参数由 app.env 提供；不在 Compose 再设默认值覆盖 env_file。
      SCHEDULER_HEARTBEAT_PATH: /var/lib/dops-scheduler/heartbeat
    entrypoint: ["python3"]
    command:
      - -m
      - common.public_data.scheduler
    volumes:
      - /opt/dops/repo:/opt/dops/repo:ro
      - /opt/dops/config-local:/opt/dops/config-local:ro
      - /opt/dops/live/source-credentials.json:/run/live-input/source-credentials.json:ro
      - /opt/dops/live:/opt/dops/live:ro
      # roll-manifest 管线每日重写 WDT 窗口块（sync-wdt 前置），需写权限
      - /opt/dops/live/source-manifest.json:/opt/dops/live/source-manifest.json:rw
      - /opt/dops/pages-output:/output
      # RAG 向量索引（2026-10-13）：rag-index-products 读写 Milvus Lite
      # 嵌入式库文件（/opt/vector/data/rag.db），落宿主机持久化。
      - /opt/vector:/opt/vector:rw
      - /opt/dops/scheduler-state:/var/lib/dops-scheduler:rw
      - /opt/dops/kb-exports:/opt/dops/kb-exports:rw
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import os,sys,time;sys.exit(0 if time.time()-os.path.getmtime('/var/lib/dops-scheduler/heartbeat')<120 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 运维系统（2026-09-30 上云）：权限管理 + 定时任务管理（管道列表/开关/
  # 新增/立即运行一次）。双闸——网络层经 SG 收紧到运维来源（见下）、应用层
  # admin scope 校验（require_admin）；不是面向全员的服务。与 bi-web 同款桥接
  # + 端口映射（uvicorn 固定 8080 → 宿主机 18100）。写面依赖 BI_WEB_SESSION_SECRET
  # 必须注入（否则启动即失败），BI_DINGTALK_APPKEY/APPSECRET 提供钉钉免登。
  # 暴露面：SG 放行 18100 ← <运维/公司办公网来源>（务必窄于 bi-web 的 18080
  # 规则；更严可做 127.0.0.1:18100:8080 + SSH 隧道）。BI_* 凭据与 bi-web 同款
  # 仓库外 env_file 透传，绝不写死在 repo。上线前置：①app.env 注入
  # BI_WEB_SESSION_SECRET（必填）；②RDS mart 库应用迁移 mart-ops-run-requests-v1
  # （建 pd_ops_run_request / pd_ops_pipeline_audit）；③scheduler 已内置
  # run-requests 轮询，随本批次一并 up -d 重建。
  ops-web:
    image: dops-app:latest
    container_name: dops-ops-web
    restart: unless-stopped
    # BI_* 凭据走独立的 /opt/dops/ops-web.env（服务器本地、不入库）：app.env
    # 与 bi-web 共享，直接注入 BI_WEB_SESSION_SECRET 会让 bi-web 下次重建时
    # 从「阶段 1.5 公网全开放」意外切到登录态，必须隔离。
    env_file:
      - /opt/dops/app.env
      - /opt/dops/ops-web.env
    working_dir: /opt/dops/repo
    environment:
      TZ: Asia/Shanghai
      PYTHONDONTWRITEBYTECODE: "1"
      PUBLIC_DATA_SERVICE_ID: ops-web
      # 注册表读（管道列表/舰队源）与写（开关/新增）的 seed 路径；Nacos
      # 不可达时回退 seed。scheduler 同款，Nacos 配置随 app.env 注入。
      PUBLIC_DATA_PIPELINE_SEED: /opt/dops/repo/docker/integration/pipelines.seed.yaml
      PUBLIC_DATA_PRICE_AGENT_SEED: /opt/dops/repo/docker/integration/price-agent-maochao.yaml
      # 工作日历页（2026-10-10）：rewrite_month 的基线种子路径（与
      # scheduler/extract 同款；法定导入与人工裁决写 DB，不回写本文件）。
      PUBLIC_DATA_CALENDAR_SEED: /opt/dops/repo/docker/integration/calendar.seed.json
    entrypoint: ["python3"]
    command:
      - -m
      - common.ops_web.app
    ports:
      - "18100:8080"
    volumes:
      - /opt/dops/repo:/opt/dops/repo:ro
      - /opt/dops/live:/opt/dops/live:ro
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=5).status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # 榜单页请求时渲染（pages-web）已随线下业务线迁 offline-branch（2026-11-18）：
  # common/pages_web 不在本仓，此处保留服务定义只会在下次部署拉起一个
  # module not found 的容器，健康门随即整次回滚。主仓只保留 nginx 侧的同端口
  # 切流（127.0.0.1:18090 → dops-offline-pages-web），容器与探针由
  # offline-branch 的 docker-compose.yml / deploy-offline.sh 负责。

  # 榜单静态页发布（2026-09-23 提前拉起）：serve pages-output，host 网络占 80。
  # 2026-10-13 起榜单 html 反代 pages-web（请求时渲染），静态文件退为
  # last-good 兜底；bi-web 公网反代待阶段 2（备案+域名+免登）再加。
  nginx:
    image: nginx:1.27-alpine
    container_name: dops-nginx
    network_mode: host
    restart: unless-stopped
    volumes:
      - /opt/dops/nginx/pages.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/dops/pages-output:/usr/share/nginx/html:ro
      # Let's Encrypt（2026-10-20，dt.yyhlzj.com）：acme = http-01 验证
      # webroot；letsencrypt = 证书目录（certbot 容器写入，nginx 只读消费）。
      - /opt/dops/nginx/acme:/usr/share/nginx/acme:ro
      - /opt/dops/letsencrypt:/etc/letsencrypt:ro

  # NTP 授时（2026-09-23）：chronyd 校准宿主机内核时钟（容器共享宿主时钟，
  # gateway/scheduler/nginx 自动受益），host 网络下 123/udp 对私网授时。
  # 上游实测可用：阿里 ntp.aliyun.com/ntp1 + 腾讯 time1（百度/清华源出向
  # UDP/123 全丢包，2026-09-23 实测）。chrony.conf 在 repo docker/integration/ntp/。
  ntp:
    build:
      context: /opt/dops/repo/docker/integration/ntp
    image: dops-ntp:local
    container_name: dops-ntp
    network_mode: host
    cap_add:
      - SYS_TIME
    volumes:
      - /opt/dops/ntp-data:/var/lib/chrony
    restart: unless-stopped
