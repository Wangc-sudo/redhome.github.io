# dops-app 榜单页面对外发布（临时通道，替代待决策的 OSS/CDN）
# 服务 /opt/dops/pages-output 下 pages-* 管线每日 08:30 再生的静态 HTML。
# 文件名固定且内容每日覆盖，必须 no-store 防浏览器/中间缓存吃旧榜。

# —— To C 边缘加固（2026-10-26 用户裁决，SG 冻结前提下的 nginx 层防线）——
# 隐藏版本号（漏 banner 等于给扫描器递指纹）。
server_tokens off;
# 按客户端 IP 限速：pages_api=数据/渲染面（BI 轮询 7 卡/5min/端，
# 30r/m+burst20 余量充足）；pages_auth=登录交换面防爆破。
# 静态壳不限流（正常浏览零误伤）。本文件单文件挂载进容器（无 include
# 片段条件），add_header 继承规则（本层有 add_header 则上层全失效）
# 要求安全头在带 Cache-Control 的 location 逐段补全。
limit_req_zone $binary_remote_addr zone=pages_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=pages_auth:10m rate=6r/m;

server {
    # 2026-10-20 域名 dt.yyhlzj.com ICP 备案完成、DNS A 记录生效，
    # 切 80 正式对外。SG 80/443 已全放行。
    # （PR #179 在旧基底上误回退了 listen 80，本 PR 恢复。）
    # 2026-10-26：8300 过渡期满软下线——拆独立 server 只回 301 跳域名
    # （文件尾），存量书签/聊天记录旧链接继续可用但落到新域名。
    listen 80 default_server;
    # HTTPS（2026-10-23，Let's Encrypt ECC，acme.sh webroot 签发、ARI 自动
    # 续期 + reloadcmd 自动 reload）：同一 server 双 listen——80/8300 仍走
    # http（存量旧链接不受影响），443 走 TLS。钉钉 H5 微应用强制 https
    # （移动端 ATS），/kb/ 的可用性依赖本段。80→443 跳转未做（待裁决，
    # 跳转后 http 旧链接会 301，观察期维持现状）。
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/dt.yyhlzj.com.fullchain.cer;
    ssl_certificate_key /etc/letsencrypt/dt.yyhlzj.com.key;
    server_name _;

    root /usr/share/nginx/html;
    autoindex off;

    # 安全响应头（2026-10-26）：对不带 add_header 的 location（API 反代段）
    # 生效；带 Cache-Control 的 location 已逐段补全同款三枚（继承规则）。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 1024;
    # 2026-10-24：扩展压缩面——JS/CSS/JSON 此前裸传（BI 壳 ~85KB，
    # 公网链路实测加载慢），压缩后约 1/4。text/javascript 是 FastAPI
    # StaticFiles 对 .js 的实际 Content-Type（实测 CSS 已压 JS 裸传）。
    gzip_types text/html text/css application/javascript text/javascript
               application/json;

    # 裸域名便利性跳转：默认落到杭州榜（当前唯一有真群流量区域）
    location = / {
        return 302 /hangzhou.html;
    }

    # 杭州线下销售BI看板（2026-10-09 运维裁决：hangzhou.html 静态页切
    # BI、URL 保留，反代方案 A——仅此看板经 8300 暴露，其余看板仍锁
    # 18080 办公网白名单）。bi-web 桥接映射在宿主机 127.0.0.1:18080。
    # 回退 = 删本段四个 location（静态 hangzhou.html 文件仍在 pages-output）。
    location = /hangzhou.html {
        proxy_pass http://127.0.0.1:18080/d/hz-offline-sales;
        proxy_set_header Host $host;
        # 上游 StaticFiles/FastAPI 不发 Cache-Control，浏览器会启发式缓存
        # 旧壳（2026-10-10 排版上线后运维端「没变化」实锤）——壳与静态
        # 资源一律 no-store，每次访问回源取新。
        add_header Cache-Control "no-store";
        # 安全头三枚（继承规则：本层有 add_header 则 server 级失效，故补全）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # BI 壳静态资源（bi.html/bi.js/bi-data.js/bi.css 等，无数据面）
    location /web/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
        # 安全头三枚（继承规则：本层有 add_header 则 server 级失效，故补全）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # BI API 白名单：仅杭州看板的定义/卡片 + dates 筛选值域——其他看板
    # 的 /api/v1/d/* 与导航列表 /api/v1/dashboards 一律不代理（命中下方
    # 静态 location 得 404，客户端 buildNav 失败静默降级为无顶栏的独立
    # 大屏，恰是想要的效果）
    location = /api/v1/dashboards/hz-offline-sales {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        # 限流（2026-10-26 To C 加固）：BI 数据面按客户端 IP 限速
        limit_req zone=pages_api burst=20 nodelay;
    }
    location ~ ^/api/v1/d/hz-offline-sales/cards/[a-z0-9_]+$ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        # 限流（2026-10-26 To C 加固）：BI 数据面按客户端 IP 限速
        limit_req zone=pages_api burst=20 nodelay;
    }
    # 线下整体销售BI看板（2026-10-10 运维裁决：offline_all.html 静态页切
    # BI、URL 保留，同 hangzhou.html 反代方案 A）。回退 = 删本段三个
    # location（静态 offline_all.html 文件仍在 pages-output）。
    location = /offline_all.html {
        proxy_pass http://127.0.0.1:18080/d/offline-all-sales;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
        # 安全头三枚（继承规则：本层有 add_header 则 server 级失效，故补全）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /api/v1/dashboards/offline-all-sales {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        # 限流（2026-10-26 To C 加固）：BI 数据面按客户端 IP 限速
        limit_req zone=pages_api burst=20 nodelay;
    }
    location ~ ^/api/v1/d/offline-all-sales/cards/[a-z0-9_]+$ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        # 限流（2026-10-26 To C 加固）：BI 数据面按客户端 IP 限速
        limit_req zone=pages_api burst=20 nodelay;
    }
    # 绍兴线下销售BI看板（2026-10-10 运维裁决：shaoxing.html 静态页切
    # BI、URL 保留，同 hangzhou.html 反代方案 A）。回退 = 删本段三个
    # location（静态 shaoxing.html 文件仍在 pages-output）。
    location = /shaoxing.html {
        proxy_pass http://127.0.0.1:18080/d/sx-offline-sales;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
        # 安全头三枚（继承规则：本层有 add_header 则 server 级失效，故补全）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /api/v1/dashboards/sx-offline-sales {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        # 限流（2026-10-26 To C 加固）：BI 数据面按客户端 IP 限速
        limit_req zone=pages_api burst=20 nodelay;
    }
    location ~ ^/api/v1/d/sx-offline-sales/cards/[a-z0-9_]+$ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        # 限流（2026-10-26 To C 加固）：BI 数据面按客户端 IP 限速
        limit_req zone=pages_api burst=20 nodelay;
    }
    # 渠道销售BI看板桥（2026-10-13 曾挂于旧真源 pages-cloud.conf，回灌
    # 入本文件时漏带，2026-10-23 补回；13 个旧页板块已迁成 BI 卡）。
    location = /qudao.html {
        proxy_pass http://127.0.0.1:18080/d/qd-channel-sales;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
        # 安全头三枚（继承规则：本层有 add_header 则 server 级失效，故补全）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /api/v1/dashboards/qd-channel-sales {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        # 限流（2026-10-26 To C 加固）：BI 数据面按客户端 IP 限速
        limit_req zone=pages_api burst=20 nodelay;
    }
    location ~ ^/api/v1/d/qd-channel-sales/cards/[a-z0-9_]+$ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        # 限流（2026-10-26 To C 加固）：BI 数据面按客户端 IP 限速
        limit_req zone=pages_api burst=20 nodelay;
    }
    # 运营闭环看板（2026-10-24 用户裁决上公网域名，与各区榜同方案 A）。
    # 回退 = 删本段三个 location。
    location = /ops.html {
        proxy_pass http://127.0.0.1:18080/d/ops-health;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
        # 安全头三枚（继承规则：本层有 add_header 则 server 级失效，故补全）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /api/v1/dashboards/ops-health {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        # 限流（2026-10-26 To C 加固）：BI 数据面按客户端 IP 限速
        limit_req zone=pages_api burst=20 nodelay;
    }
    location ~ ^/api/v1/d/ops-health/cards/[a-z0-9_]+$ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        # 限流（2026-10-26 To C 加固）：BI 数据面按客户端 IP 限速
        limit_req zone=pages_api burst=20 nodelay;
    }
    location = /api/v1/options/dates {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        # 限流（2026-10-26 To C 加固）：BI 数据面按客户端 IP 限速
        limit_req zone=pages_api burst=20 nodelay;
    }

    # 小易 Web 对话前端（2026-10-23，方案 V1）：SPA 壳与 /kb/api 都反代
    # bi-web（壳由 bi-web StaticFiles 直出 repo 内 dist）。/kb/api/ 前缀
    # 更长天然先匹配。回退 = 删本段两个 location。
    location /kb/api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
        # 安全头三枚（继承规则：本层有 add_header 则 server 级失效，故补全）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # 发消息走 agent 多轮查数常态 15~60s+，默认 60s read timeout 会把
        # 慢查询 504 掉（前端报「网络异常」）——与前端 MESSAGE_TIMEOUT_MS
        # 对齐放宽到 120s（2026-10-26）。
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # 限流（2026-10-26 To C 加固）：LLM 调用成本高，防刷重点
        limit_req zone=pages_api burst=20 nodelay;
    }
    # Vite 哈希产物可长缓存（文件名即指纹）；壳 index.html 走下方 no-store。
    location /kb/assets/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location /kb/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
        # 安全头三枚（继承规则：本层有 add_header 则 server 级失效，故补全）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 小易 Web 登录链路（2026-10-23 补）：/auth/entry 登录页、
    # /auth/dingtalk 免登交换、/auth/jsapi-config 签名、/auth/logout。
    # 不反代则钉钉内免登也不通（交换端点 404）。无鉴权敏感面：dingtalk
    # 交换只发 session cookie，entry 是静态页。
    location /auth/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        # 限流（2026-10-26 To C 加固）：登录交换面防爆破（6r/m+burst5）
        limit_req zone=pages_auth burst=5 nodelay;
        add_header Cache-Control "no-store";
        # 安全头三枚（继承规则：本层有 add_header 则 server 级失效，故补全）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Let's Encrypt http-01 验证（2026-10-20 dt.yyhlzj.com 证书签发/续期）：
    # webroot 映射宿主机 /opt/dops/nginx/acme，certbot 写入、nginx 只读。
    # 此路径永不参与未来的 80→443 跳转。
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/acme;
        try_files $uri =404;
    }

    # —— 榜单页请求时渲染：反代 pages-web（宿主环回 18090）——
    # 正则含 {}，nginx 配置解析要求整段加引号，否则 nginx -t emerg
    # （2026-10-13 实测：HUP 静默失效、切流不生效，且 nginx 重启会启动失败）。
    # 2026-10-23 回灌入库：此段此前只存在于云上文件（仓库版缺失），导致
    # 「以仓库为真源重新发布」时榜单页渲染整体丢失，故补登记。
    location ~ "^/[a-z0-9_]+(-\d{4}-\d{2}-\d{2})?\.html$" {
        proxy_pass http://127.0.0.1:18090;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 502 504 = @static;
        # 限流（2026-10-26 To C 加固）：请求时渲染是重活，防爬防刷
        limit_req zone=pages_api burst=20 nodelay;
        add_header Cache-Control "no-store";
        # 安全头三枚（继承规则：本层有 add_header 则 server 级失效，故补全）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # 渲染服务整体挂掉时的 last-good 静态兜底（503 而非 502，便于区分）
    location @static {
        try_files $uri =503;
        add_header Cache-Control "no-store";
        # 安全头三枚（继承规则：本层有 add_header 则 server 级失效，故补全）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri =404;
        add_header Cache-Control "no-store";
        # 安全头三枚（继承规则：本层有 add_header 则 server 级失效，故补全）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

# —— 8300 软下线（2026-10-26 用户裁决，过渡期满）——
# ICP 备案前 80 被运营商拦截时的临时端口；域名上线后存量书签/聊天记录
# 旧链接 301 落到正式域名（SG 规则按冻结裁决不动，端口仍监听但页面
# 本体不再由此伺服）。彻底关端口 = 删本 server 块 +（SG 解冻后）删规则。
server {
    listen 8300;
    server_name _;
    server_tokens off;
    return 301 http://dt.yyhlzj.com$request_uri;
}
